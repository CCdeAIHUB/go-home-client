name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: npm install
        working-directory: client-ui
      - run: npm run build
        working-directory: client-ui
      - run: dotnet build client-pc/GoHome.Pc.csproj

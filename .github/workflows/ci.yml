name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - run: go work sync
      - run: go test ./...
        working-directory: shared/go
      - run: go test ./...
        working-directory: client-core

  build-android-and-windows:
    needs: test-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: go work sync
      - run: npm ci
        working-directory: client-ui
      - run: npm run build
        working-directory: client-ui
      - name: Copy client UI into Android assets
        run: |
          rm -rf client-android/app/src/main/assets/ui
          mkdir -p client-android/app/src/main/assets/ui
          cp -R client-ui/dist/. client-android/app/src/main/assets/ui/
      - name: Build Android debug APK
        run: gradle --project-dir client-android :app:assembleDebug
      - name: Publish Windows win-x64 client
        run: |
          GOOS=windows GOARCH=amd64 go build -o ../artifacts/windows/go-home-client-core.exe ./cmd/client-core
        working-directory: client-core
      - name: Add Wintun runtime
        run: |
          curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  wintun.zip" | sha256sum -c -
          unzip -j wintun.zip wintun/bin/amd64/wintun.dll -d artifacts/windows
      - name: Publish Windows win-x64 shell
        run: |
          dotnet publish client-pc/GoHome.Pc.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o artifacts/windows
          mkdir -p artifacts/windows/ui
          cp -R client-ui/dist/. artifacts/windows/ui/
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: go-home-android-debug-apk
          path: client-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: go-home-windows-win-x64
          path: artifacts/windows/**
          if-no-files-found: error

  release:
    needs: build-android-and-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: go-home-android-debug-apk
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: go-home-windows-win-x64
          path: release/windows
      - name: Package Windows release
        run: |
          cd release/windows
          zip -r ../../go-home-windows-win-x64.zip .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/android/*.apk
            go-home-windows-win-x64.zip
          generate_release_notes: true
